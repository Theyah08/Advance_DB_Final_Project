<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - Prosfora Gift Shop POS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-card" style="text-align: center;">
        <div class="auth-header">
            <div class="brand-icon">?</div>
            <h2>404 - Page Not Found</h2>
            <p>The requested page or resource could not be found.</p>
        </div>
        <div class="auth-body">
            <p style="color: var(--muted-text); margin-bottom: 1.5rem;">
                The item or URL you were looking for does not exist or has been removed.
            </p>
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary" style="width: 100%;">
                Return to Dashboard
            </a>
        </div>
    </div>
</body>
</html>
